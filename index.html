<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>JammyShop</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">JammyShop</div>
  <div>
    <a href="#">Home</a>
    <a href="#">Store</a>
    <a href="#">Cart</a>
  </div>
</div>

<!-- Hero -->
<div class="hero">
  <h1>Welcome to JammyShop</h1>
  <p>Buy Custom item, ranks and coins</p>
</div>

<!-- Games -->
<div class="games">

  <div class="card">
    <div class="card-content">
      <h3>ex</h3>
      <div class="price">23,000ks</div>
      <button onclick="buyGame('Ex')">Buy</button>
    </div>
  </div>

    <div class="card">
    <div class="card-content">
      <h3>ex2</h3>
      <div class="price">30,000ks</div>
      <button onclick="buyGame('ex2')">Buy</button>
    </div>
  </div>

    <div class="card">
    <div class="card-content">
      <h3>ex3</h3>
      <div class="price">40,000ks</div>
      <button onclick="buyGame('ex3')">Buy</button>
    </div>
  </div>
</div>

<!-- Footer -->
<div class="footer">
  © 2026 JammyShop
</div>

<script src="script.js"></script>
</body>
</html>
