<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JammyShop</title>

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">

</head>
<body>

  <!-- Navbar -->

    <div class="logo">JammyShop</div>

        <div class="card-content">
          <h3>ex</h3>
          <div class="price">24,000ks</div>
        </div>
        <a href="buy.html">
          <button type="button">Buy Now</button>
        </a>
      </div>

      <div class="card">
        <div class="card-content">
          <h3>ex2</h3>
          <div class="price">30,000ks</div>
        </div>

          <button type="button">Buy Now</button>
        </a>
      </div>

      <div class="card">
        <div class="card-content">
          <h3>ex3</h3>
          <div class="price">40,000ks</div>
        </div>
        <a href="buy3.html">
          <button type="button">Buy Now</button>
        </a>
      </div>

    </div> <!-- End card-container -->
  </div> <!-- End games -->

  <!-- Footer -->
  <div class="footer">
    © 2026 JammyShop
  </div>

  <script src="script.js"></script>
</body>
</html>
